      - "*_BOOTS"
    effects:
      speed:
        type: SPEED
        level: 1
        slot: 11
        icon: NETHER_STAR
        display-name: "<aqua>Скорость"
        price-money: 400000.0
        price-points: 80
      jump-boost:
        type: JUMP_BOOST
        level: 1
        slot: 13
        icon: NETHER_STAR
        display-name: "<green>Прыгучесть"
        price-money: 300000.0
        price-points: 60
      dolphins-grace:
        type: DOLPHINS_GRACE
        level: 1
        slot: 15
        icon: NETHER_STAR
        display-name: "<blue>Грация дельфина"
        price-money: 350000.0
        price-points: 70
  weapons:
    match:
      - "*_SWORD"
      - "*_AXE"
      - "MACE"
      - "TRIDENT"
      - "BOW"
      - "CROSSBOW"
    effects:
      strength:
        type: STRENGTH
        level: 1
        slot: 11
        icon: NETHER_STAR
        display-name: "<red>Сила"
        price-money: 500000.0
        price-points: 100
      speed:
        type: SPEED
        level: 1
        slot: 13
        icon: NETHER_STAR
        display-name: "<aqua>Скорость"
        price-money: 400000.0
        price-points: 80
  tools:
    match:
      - "*_PICKAXE"
      - "*_SHOVEL"
      - "*_HOE"
    effects:
      haste:
        type: HASTE
        level: 1
        slot: 11
        icon: NETHER_STAR
        display-name: "<yellow>Спешка"
        price-money: 500000.0
        price-points: 100
      night-vision:
        type: NIGHT_VISION
        level: 1
        slot: 13
        icon: NETHER_STAR
        display-name: "<red>Ночное зрение"
        price-money: 250000.0
        price-points: 50
